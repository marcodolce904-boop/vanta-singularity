name: CAT-ALOG - installer e aggiornamenti

# Ogni modifica a CAT-ALOG sul ramo principale: prova i test, crea l'installer per Windows
# e lo pubblica come «Release» su GitHub. Le app installate lo scaricano da sole.
on:
  push:
    branches: [claude/sweet-newton-uovnqp, main]
    paths: ['CAT-ALOG/**', '.github/workflows/cat-alog-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-alog-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CAT-ALOG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CAT-ALOG/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  release:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CAT-ALOG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CAT-ALOG/package-lock.json
      - run: npm ci
      # numero di versione automatico: 1.0.<numero esecuzione>, sempre crescente
      - run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
