<!doctype html>
<html lang="it">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAT-ALOG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">CAT-ALOG</h1>
    <nav class="tabs" role="tablist" aria-label="Schede" id="tabs"></nav>

      <button type="button" class="btn" id="btn-search" title="Cerca in tutte le schede (Ctrl+K)">Cerca</button>

      <button type="button" class="btn" id="btn-settings">Impostazioni</button>
    </div>
  </header>
  <main id="main"></main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="../lib/shared.js"></script>
  <script src="../lib/responsive.js"></script>
  <script src="js/core.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/items.js"></script>
  <script src="js/classi.js"></script>
  <script src="js/responsive.js"></script>
  <script src="js/root.js"></script>
  <script src="app.js"></script>
</body>
</html>
