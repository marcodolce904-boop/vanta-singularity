    <path d="M30.500 27h3l-1.500 2z" fill="#f2a6b0" stroke-width="1.200"/>
    <path d="M32 29v1.500q-2 2-4 0M32 30.500q2 2 4 0" fill="none" stroke-width="1.500"/>
