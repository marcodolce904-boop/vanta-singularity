    <ellipse cx="22.500" cy="50" rx="3.800" ry="4.600" fill="#f4b73c" stroke-width="1.500"/>
    <path d="M20.500 50h4M22.500 47.500v5" stroke-width="1.100" stroke="#9a6a10"/>
    <!-- orecchie -->
    <path d="M17 18 15 6l10 6z" fill="#fff6e5"/>
    <path d="M47 18 49 6 39 12z" fill="#fff6e5"/>
    <path d="M18.500 14 17.800 9.500 22 12z" fill="#f2a6b0" stroke="none"/>
    <path d="M45.500 14 46.200 9.500 42 12z" fill="#f2a6b0" stroke="none"/>
